<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayNest - เพิ่มสัญญา</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/add.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">

<header class="topbar">
  <a href="index.html" class="glass" aria-label="กลับ">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <div class="logo">
    <h1>เพิ่มสัญญา</h1>
    <p>PayNest Premium</p>
  </div>

  <button class="glass" id="saveBtn">
    <i class="fa-solid fa-floppy-disk"></i>
  </button>
</header>

<main class="add-form">

<section class="glass form-card">

<div class="image-picker">
  <i class="fa-regular fa-image"></i>
  <p>เลือกรูปสินค้า</p>
</div>

<label>ชื่อสินค้า</label>
<input id="productName" type="text" placeholder="เช่น vivo V70">

<label>ร้านค้า</label>
<input id="storeName" type="text" placeholder="ชื่อร้าน">

<label>ราคารวม (บาท)</label>
<input id="totalPrice" type="number">

<label>เงินดาวน์ (บาท)</label>
<input id="downPayment" type="number" value="0">

<label>จำนวนงวด</label>
<input id="installments" type="number">

<label>วันที่เริ่มผ่อน</label>
<input id="startDate" type="date">

<label>หมายเหตุ</label>
<textarea id="note" rows="4" placeholder="รายละเอียดเพิ่มเติม"></textarea>

<button id="submitContract" class="primary-btn">
  <i class="fa-solid fa-plus"></i>
  บันทึกสัญญา
</button>

</section>

</main>

<script src="js/storage.js"></script>
<script src="js/add.js"></script>
</body>
</html>
