<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Installments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      💳
    </div>

    <div>

      <h1>My Installments</h1>

      <p>ติดตามการผ่อนของฉัน</p>

    </div>

  </div>

  <button id="addBtn" class="icon-btn">

    +

  </button>

</header>

<main>

<section class="hero">

<div class="hero-card">

<span>

ยอดที่ต้องชำระเดือนนี้

</span>

<h1 id="totalPay">

0 บาท

</h1>

<p id="contractCount">

0 สัญญา

</p>

</div>

</section>

<section class="summary">

<div class="summary-card">

<p>

ยอดคงเหลือ

</p>

<h2 id="remainTotal">

0 บาท

</h2>

</div>

<div class="summary-card">

<p>

ชำระแล้ว

</p>

<h2 id="paidPercent">

0%

</h2>

</div>

</section>

<div id="alertBox"></div>

<section class="section-title">

<h2>

รายการผ่อนทั้งหมด

</h2>

</section>

<section id="contracts">

<div class="empty-state">

<div class="empty-icon">

📦

</div>

<h3>

ยังไม่มีรายการผ่อน

</h3>

<p>

กดปุ่ม + เพื่อเพิ่มรายการแรก

</p>

</div>

</section>

</main>

<button id="fab" class="fab">

+

</button>

<nav class="bottom-nav">

<button class="active">

🏠

<span>

หน้าหลัก

</span>

</button>

<button>

📅

<span>

ปฏิทิน

</span>

</button>

<button>

📊

<span>

สถิติ

</span>

</button>

<button>

⚙️

<span>

ตั้งค่า

</span>

</button>

</nav>

<div id="sheet" class="sheet hidden">

<div class="sheet-content">

<div class="sheet-header">

<h2>

เพิ่มรายการผ่อน

</h2>

<button id="closeSheet">

✕

</button>

</div>

<div class="form-group">

<label>

ชื่อสินค้า

</label>

<input
id="productName"
type="text">

</div>

<div class="form-group">

<label>

ร้านค้า

</label>

<input
id="storeName"
type="text">

</div>

<div class="form-group">

<label>

ค่างวดต่อเดือน

</label>

<input
id="monthlyPay"
type="number">

</div>

<div class="form-group">

<label>

ยอดคงเหลือ

</label>

<input
id="remainPay"
type="number">

</div>

<div class="form-group">

<label>

จำนวนงวดทั้งหมด

</label>

<input
id="totalInstallments"
type="number">

</div>

<div class="form-group">

<label>

งวดที่จ่ายแล้ว

</label>

<input
id="paidInstallments"
type="number"
value="0">

</div>

<div class="form-group">

<label>

วันเริ่มสัญญา

</label>

<input
id="firstPayDate"
type="date">

</div>

<div class="form-group">

<label>

รอบการชำระ

</label>

<select id="payCycle">

<option value="7">
ทุก 7 วัน
</option>

<option value="15">
ทุก 15 วัน
</option>

<option value="30">
ทุก 1 เดือน
</option>

</select>

</div>

<button
id="saveContract"
class="save-btn">

บันทึก

</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
