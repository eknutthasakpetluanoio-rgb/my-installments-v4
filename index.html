<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayNest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-blur"></div>

<header class="topbar">

<div class="brand">

<div class="logo">
<span class="material-symbols-rounded">account_balance_wallet</span>
</div>

<div>

<h1>PayNest</h1>

<p>Luxury Installments Tracker</p>

</div>

</div>

<button id="addBtn" class="glass-btn">

<span class="material-symbols-rounded">
add
</span>

</button>

</header>

<main>

<section class="hero glass">

<h3>ยอดที่ต้องชำระเดือนนี้</h3>

<h1 id="totalPay">฿0</h1>

<div class="progress">

<div id="progressBar"></div>

</div>

<div class="hero-bottom">

<p id="contractCount">0 สัญญา</p>

<p id="remainCount">เหลือ 0 งวด</p>

</div>

</section>

<section class="summary">

<div class="card glass">

<p>ยอดคงเหลือ</p>

<h2 id="remainMoney">฿0</h2>

</div>

<div class="card glass">

<p>ชำระแล้ว</p>

<h2 id="paidPercent">0%</h2>

</div>

</section>

<section class="actions">

<button class="glass action">

<span class="material-symbols-rounded">
add_circle
</span>

<p>เพิ่ม</p>

</button>

<button class="glass action">

<span class="material-symbols-rounded">
search
</span>

<p>ค้นหา</p>

</button>

<button class="glass action">

<span class="material-symbols-rounded">
calendar_month
</span>

<p>ปฏิทิน</p>

</button>

<button class="glass action">

<span class="material-symbols-rounded">
bar_chart
</span>

<p>สถิติ</p>

</button>

</section>

<section class="contracts">

<h2>รายการผ่อนทั้งหมด</h2>

<div id="contracts"></div>

</section>

</main>

<button class="fab" id="fab">

<span class="material-symbols-rounded">
add
</span>

</button>

<nav class="bottom-nav glass">

<button class="active">

<span class="material-symbols-rounded">
home
</span>

<p>หน้าหลัก</p>

</button>

<button>

<span class="material-symbols-rounded">
calendar_month
</span>

<p>ปฏิทิน</p>

</button>

<button>

<span class="material-symbols-rounded">
bar_chart
</span>

<p>สถิติ</p>

</button>

<button>

<span class="material-symbols-rounded">
settings
</span>

<p>ตั้งค่า</p>

</button>

</nav>

<script src="app.js"></script>

</body>
</html>
