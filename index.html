<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Installments v4</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div>
    <h1>💳 My Installments</h1>
    <p>ติดตามการผ่อนของฉัน</p>
  </div>

  <button id="addBtn" class="icon-btn">＋</button>

</header>

<main>

  <section class="hero-card">

    <p class="hero-title">ยอดที่ต้องชำระเดือนนี้</p>

    <h1 id="totalPay">0 บาท</h1>

    <span id="contractCount">0 สัญญา</span>

  </section>

  <section class="summary">

    <div class="summary-card">
      <p>ยอดคงเหลือ</p>
      <h2 id="remainTotal">0 บาท</h2>
    </div>

    <div class="summary-card">
      <p>ชำระแล้ว</p>
      <h2 id="paidPercent">0%</h2>
    </div>

  </section>

  <div class="section-header">

    <h2>รายการผ่อนทั้งหมด</h2>

  </div>

  <section id="contracts">

  </section>

</main>

<button class="fab" id="fab">+</button>

<nav class="bottom-nav">

  <button class="active">
    🏠
    <span>หน้าหลัก</span>
  </button>

  <button>
    📅
    <span>ปฏิทิน</span>
  </button>

  <button>
    📊
    <span>สถิติ</span>
  </button>

  <button>
    ⚙️
    <span>ตั้งค่า</span>
  </button>

</nav>

<script src="app.js"></script>

</body>
</html>
