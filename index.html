<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>
<!-- Add Contract Modal -->
<div class="modal" id="addModal">

  <div class="modal-content">

    <h2>เพิ่มรายการผ่อน</h2>

    <input id="name" type="text" placeholder="ชื่อสินค้า">

    <input id="price" type="number" placeholder="ราคาสินค้า">

    <input id="down" type="number" placeholder="เงินดาวน์">

    <input id="months" type="number" placeholder="จำนวนงวด">

    <button id="saveBtn">บันทึก</button>

  </div>

</div>
<body>

<div class="background"></div>

<div class="container">

<header>

<div class="logo">
<h1>PayNest</h1>
<p>Track Every Installment</p>
</div>

<button class="profile">
<span class="material-symbols-rounded">
account_circle
</span>
</button>

</header>

<section class="hero">

<p class="label">
ยอดที่ต้องชำระเดือนนี้
</p>

<h2 id="monthlyTotal">
฿0
</h2>

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>

<div class="hero-info">

<div>

<span>ยอดคงเหลือ</span>

<strong id="remainMoney">
฿0
</strong>

</div>

<div>

<span>สัญญา</span>

<strong id="contractCount">
0
</strong>

</div>

</div>

</section>

<section class="insight">

<h3>

<span class="material-symbols-rounded">

lightbulb

</span>

Smart Insight

</h3>

<p id="insight">

ยังไม่มีข้อมูล

</p>

</section>

<section>

<h3 class="title">

รายการผ่อน

</h3>

<div id="contractList">

</div>

</section>

<button class="fab">

<span class="material-symbols-rounded">

add

</span>

</button>

<nav class="bottom-nav">

<button class="active">

<span class="material-symbols-rounded">

home

</span>

</button>

<button>

<span class="material-symbols-rounded">

calendar_month

</span>

</button>

<button>

<span class="material-symbols-rounded">

bar_chart

</span>

</button>

<button>

<span class="material-symbols-rounded">

settings

</span>

</button>

</nav>

</div>

<script src="app.js"></script>

</body>
</html>
