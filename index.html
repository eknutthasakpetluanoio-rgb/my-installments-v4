<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">

  <title>PayNest</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

<header class="hero-card">

<div class="hero-header">

<div class="hero-title">

<h1>PayNest</h1>
<p>Dashboard</p>

</div>

<button id="profileBtn" class="icon-button" type="button" aria-label="Profile">
☰
</button>

</div>

<div class="hero-content">

<h2 id="monthlyIncome">
฿0
</h2>

<p>รายรับเดือนนี้</p>

</div>

</header>

<section class="summary-grid">

<div class="summary-card">
<span>วันนี้</span>
<strong id="todayIncome">฿0</strong>
</div>

<div class="summary-card">
<span>ทั้งหมด</span>
<strong id="totalIncome">฿0</strong>
</div>

<div class="summary-card">
<span>ค้างชำระ</span>
<strong id="overdueCount">0</strong>
</div>

<div class="summary-card">
<span>สัญญา</span>
<strong id="contractCount">0</strong>
</div>

</section>

<section class="section">

<div class="section-header">

<h2>Contracts</h2>

</div>

<div id="contractList" class="contract-list">

<!-- Contract Cards -->

</div>

</section>

</div>

<button id="fab" class="fab" type="button" aria-label="Add Contract">
+
</button>

<nav class="bottom-nav">

<button class="nav-item active" type="button">
Home
</button>

<button class="nav-item" type="button">
Contracts
</button>

<button class="nav-item" type="button">
Calendar
</button>

<button class="nav-item" type="button">
Reports
</button>

<button class="nav-item" type="button">
Settings
</button>

</nav>

<script type="module" src="js/app.js?v=2"></script>

</body>
</html>
