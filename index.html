<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#2563EB">

    <meta
        name="description"
        content="PayNest - Smart Installment Manager">

    <title>PayNest</title>

    <!-- PWA -->

    <link
        rel="manifest"
        href="manifest.json">

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="app">

    <!-- ======================
         Header
    ======================= -->

    <header class="header">

        <div class="header-top">

            <div>

                <span class="subtitle">

                    ยินดีต้อนรับ

                </span>

                <h1>

                    PayNest

                </h1>

            </div>

            <button
                id="themeButton"
                class="icon-button"
                aria-label="Theme">

                <span class="material-symbols-rounded">

                    dark_mode

                </span>

            </button>

        </div>

        <p class="header-description">

            จัดการภาระผ่อนทั้งหมดของคุณในที่เดียว

        </p>

    </header>
    <!-- ======================
         Hero Summary
    ======================= -->

    <section class="hero-card">

        <div class="hero-gradient"></div>

        <div class="hero-content">

            <span class="hero-label">

                ยอดที่ต้องชำระเดือนนี้

            </span>

            <h2 id="monthlyTotal">

                ฿0

            </h2>

            <div class="hero-stats">

                <div class="hero-item">

                    <span>

                        คงเหลือทั้งหมด

                    </span>

                    <strong id="remainMoney">

                        ฿0

                    </strong>

                </div>

                <div class="hero-item">

                    <span>

                        จำนวนสัญญา

                    </span>

                    <strong id="contractCount">

                        0

                    </strong>

                </div>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>

    </section>

    <!-- ======================
         Smart Insight
    ======================= -->

    <section class="insight-card">

        <span class="material-symbols-rounded">

            lightbulb

        </span>

        <p id="insight">

            เริ่มเพิ่มรายการผ่อนของคุณได้เลย

        </p>

    </section>

    <!-- ======================
         Search
    ======================= -->

    <section class="search-section">

        <div class="search-box">

            <span class="material-symbols-rounded">

                search

            </span>

            <input
                type="search"
                id="searchInput"
                placeholder="ค้นหาสินค้า...">

        </div>

    </section>

    <!-- ======================
         Contract List
    ======================= -->

    <main
        id="contractList"
        class="contract-list">

    </main>
    <!-- ======================
         Floating Action Button
    ======================= -->

    <button
        id="addButton"
        class="fab"
        aria-label="เพิ่มรายการ">

        <span class="material-symbols-rounded">
            add
        </span>

    </button>

    <!-- ======================
         Bottom Sheet
    ======================= -->

    <div id="sheet" class="sheet-overlay">

        <div class="sheet">

            <div class="sheet-handle"></div>

            <h3 id="sheetTitle">
                เพิ่มรายการผ่อน
            </h3>

            <form id="contractForm">

                <input
                    type="text"
                    id="name"
                    placeholder="ชื่อสินค้า"
                    required>

                <input
                    type="number"
                    id="price"
                    placeholder="ราคาสินค้า"
                    required>

                <input
                    type="number"
                    id="down"
                    placeholder="เงินดาวน์"
                    value="0">

                <input
                    type="number"
                    id="months"
                    placeholder="จำนวนงวด"
                    required>

                <input
                    type="number"
                    id="monthly"
                    placeholder="ค่างวดต่อเดือน">

                <input
                    type="date"
                    id="due">

                <div class="sheet-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="btn-secondary">

                        ยกเลิก

                    </button>

                    <button
                        type="button"
                        id="saveBtn"
                        class="btn-primary">

                        บันทึก

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ======================
         Bottom Navigation
    ======================= -->

    <nav class="bottom-nav">

        <button class="nav-item active">

            <span class="material-symbols-rounded">
                home
            </span>

            <span>หน้าแรก</span>

        </button>

        <button class="nav-item">

            <span class="material-symbols-rounded">
                calendar_month
            </span>

            <span>ปฏิทิน</span>

        </button>

        <button class="nav-item">

            <span class="material-symbols-rounded">
                analytics
            </span>

            <span>สถิติ</span>

        </button>

        <button class="nav-item">

            <span class="material-symbols-rounded">
                settings
            </span>

            <span>ตั้งค่า</span>

        </button>

    </nav>

</div>

<!-- JavaScript -->

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/contract.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
